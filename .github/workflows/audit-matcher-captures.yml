name: Matcher capture audit
on:
  push:
    branches: [audit/matcher-captures-20260909]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de6bde891f4c7be3dc9b926fb5c370c6263325c8
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matcher-validation"
          test "$(git rev-parse HEAD)" = de6bde891f4c7be3dc9b926fb5c370c6263325c8
          test "$(git rev-parse HEAD^{tree})" = 4ca8e3a060fca36d3c2941534a280b565324481f
          { git rev-parse HEAD HEAD^{tree}; swift --version; } | tee "$RUNNER_TEMP/matcher-validation/identity.txt"
      - name: Debug
        shell: bash
        run: set -euo pipefail; swift test -j 4 2>&1 | tee "$RUNNER_TEMP/matcher-validation/debug.log"
      - name: Release
        shell: bash
        run: set -euo pipefail; swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/matcher-validation/release.log"
      - name: AddressSanitizer
        shell: bash
        run: set -euo pipefail; ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address 2>&1 | tee "$RUNNER_TEMP/matcher-validation/asan.log"
      - name: Verify unchanged checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matcher-capture-linux
          path: ${{ runner.temp }}/matcher-validation/
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de6bde891f4c7be3dc9b926fb5c370c6263325c8
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matcher-validation"
          test "$(git rev-parse HEAD)" = de6bde891f4c7be3dc9b926fb5c370c6263325c8
          test "$(git rev-parse HEAD^{tree})" = 4ca8e3a060fca36d3c2941534a280b565324481f
          { git rev-parse HEAD HEAD^{tree}; swift --version; } | tee "$RUNNER_TEMP/matcher-validation/identity.txt"
      - name: Debug
        shell: bash
        run: set -euo pipefail; swift test -j 4 2>&1 | tee "$RUNNER_TEMP/matcher-validation/debug.log"
      - name: Release
        shell: bash
        run: set -euo pipefail; swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/matcher-validation/release.log"
      - name: AddressSanitizer
        shell: bash
        run: set -euo pipefail; ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address 2>&1 | tee "$RUNNER_TEMP/matcher-validation/asan.log"
      - name: Verify unchanged checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matcher-capture-macos
          path: ${{ runner.temp }}/matcher-validation/
          if-no-files-found: error
          retention-days: 14
