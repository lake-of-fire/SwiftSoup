name: Apply reviewed owner-dispatch repair

on:
  push:
    branches:
      - fix/upstream-reader-output-policy-20260912

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upstream-reader-output-policy-20260912
          fetch-depth: 0
      - name: Apply bounded Node repair
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/Node.swift")
          source = path.read_text()

          owner_start_marker = "    /// Internal stack-safe lookup for source tracking and deep serialization.\n"
          owner_end_marker = "    /// A token that changes when text content in this node's tree mutates.\n"
          if source.count(owner_start_marker) != 1 or source.count(owner_end_marker) != 1:
              raise SystemExit("owner lookup markers changed unexpectedly")
          owner_start = source.index(owner_start_marker)
          owner_end = source.index(owner_end_marker, owner_start)
          owner_lines = [
              "    /// Internal stack-safe owner lookup for source tracking and source reuse.",
              "    ///",
              "    /// Built-in SwiftSoup node types use the default `ownerDocument()` semantics,",
              "    /// so their stored parent chain can be walked iteratively. At a subclass",
              "    /// boundary, resume virtual dispatch so custom owner redirection and",
              "    /// observation remain part of the public contract.",
              "    @inline(__always)",
              "    @usableFromInline",
              "    internal func ownerDocumentForInternalLookup() -> Document? {",
              "        var node: Node? = self",
              "        while let current = node {",
              "            if let document = current as? Document {",
              "                return document.ownerDocument()",
              "            }",
              "",
              "            let currentType = type(of: current)",
              "            let isBuiltIn =",
              "                currentType == Node.self ||",
              "                currentType == Element.self ||",
              "                currentType == FormElement.self ||",
              "                currentType == TextNode.self ||",
              "                currentType == DataNode.self ||",
              "                currentType == Comment.self ||",
              "                currentType == DocumentType.self ||",
              "                currentType == XmlDeclaration.self",
              "",
              "            if !isBuiltIn {",
              "                return current.ownerDocument()",
              "            }",
              "            node = current.parentNode",
              "        }",
              "        return nil",
              "    }",
              "",
          ]
          source = source[:owner_start] + "\n".join(owner_lines) + "\n" + source[owner_end:]

          dirty_start_marker = "    @inline(__always)\n@usableFromInline\ninternal func markSourceDirty(force: Bool = false) {\n"
          dirty_end_marker = "    @inline(__always)\n    @usableFromInline\n    internal func setSourceRangeEnd(_ end: Int) {\n"
          if source.count(dirty_start_marker) != 1 or source.count(dirty_end_marker) != 1:
              raise SystemExit("dirty-source markers changed unexpectedly")
          dirty_start = source.index(dirty_start_marker)
          dirty_end = source.index(dirty_end_marker, dirty_start)
          dirty_lines = [
              "    @inline(__always)",
              "    @usableFromInline",
              "    internal func markSourceDirty(force: Bool = false) {",
              "        markSourceDirty(force: force, registerDirtyRoot: true)",
              "    }",
              "",
              "    @inline(__always)",
              "    @usableFromInline",
              "    internal func markSourceDirty(force: Bool = false, registerDirtyRoot: Bool) {",
              "        var node: Node? = self",
              "        var shouldRegisterDirtyRoot = registerDirtyRoot",
              "        while let current = node {",
              "            if current.sourceRangeDirty {",
              "                if shouldRegisterDirtyRoot {",
              "                    current.ownerDocumentForInternalLookup()?.registerDirtySourceRoot(current)",
              "                }",
              "                return",
              "            }",
              "            if !force, current.treeBuilder?.isBulkBuilding == true {",
              "                return",
              "            }",
              "            current.sourceRangeDirty = true",
              "            if shouldRegisterDirtyRoot {",
              "                current.ownerDocumentForInternalLookup()?.registerDirtySourceRoot(current)",
              "                shouldRegisterDirtyRoot = false",
              "            }",
              "            node = current.parentNode",
              "        }",
              "    }",
              "",
              "    @inline(__always)",
              "    @usableFromInline",
              "    internal func setSourceRange(_ range: SourceRange, complete: Bool) {",
              "        sourceRange = range",
              "        sourceRangeIsComplete = complete",
              "        sourceRangeDirty = false",
              "    }",
              "",
          ]
          source = source[:dirty_start] + "\n".join(dirty_lines) + "\n" + source[dirty_end:]

          raw_old = "              let doc = ownerDocumentDirect(),\n"
          raw_new = "              let doc = ownerDocumentForInternalLookup(),\n"
          if source.count(raw_old) != 1:
              raise SystemExit(f"expected one raw-source owner lookup, found {source.count(raw_old)}")
          source = source.replace(raw_old, raw_new)

          slice_old = "              let source = sourceBuffer?.bytes ?? ownerDocument()?.sourceBuffer?.bytes,\n"
          slice_new = "              let source = sourceBuffer?.bytes ?? ownerDocumentForInternalLookup()?.sourceBuffer?.bytes,\n"
          if source.count(slice_old) != 1:
              raise SystemExit(f"expected one source-slice owner lookup, found {source.count(slice_old)}")
          source = source.replace(slice_old, slice_new)

          if "ownerDocumentDirect" in source:
              raise SystemExit("stale ownerDocumentDirect reference remains")

          path.write_text(source)
          PY
          git diff --check
          swift test --filter FragmentIndexConstructionTest
          swift test --filter FragmentSourceAppendTest
          swift test --filter ReaderDocumentOutputTests
          swift test --filter StackOverflow393Test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Node.swift
          git diff --cached --exit-code && exit 0
          git commit -m "Preserve owner dispatch in stack-safe source tracking"
          git push origin HEAD:fix/upstream-reader-output-policy-20260912
