          publish_fix() {
            local branch="$1" test_head="$2" expected_tree="$3" message="$4" patch="$5"
            git fetch origin "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$test_head"
            local dir
            dir="$(mktemp -d)"
            git worktree add --detach "$dir" "$test_head"
            (
              cd "$dir"
              git apply --check "$patch"
              git apply "$patch"
              git add Sources
              git commit -m "$message"
              test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
              git push origin "HEAD:refs/heads/$branch"
            )
            git worktree remove "$dir" --force
          }

