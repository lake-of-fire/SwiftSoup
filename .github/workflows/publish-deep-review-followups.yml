name: Publish deep-review followups
on:
  push:
    branches: [audit/deep-review-source-20260917]
    paths: [.github/workflows/publish-deep-review-followups.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish remaining qualified fix commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alex Ehlke'
          git config user.email 'alex.ehlke@gmail.com'
          ROOT="$PWD"

          publish_fix() {
            local branch="$1" test_head="$2" expected_tree="$3" message="$4" patch="$5"
            git fetch origin "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$test_head"
            local dir
            dir="$(mktemp -d)"
            git worktree add --detach "$dir" "$test_head"
            (
              cd "$dir"
              git apply --check "$ROOT/$patch"
              git apply "$ROOT/$patch"
              git add Sources
              git commit -m "$message"
              test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
              git push origin "HEAD:refs/heads/$branch"
            )
            git worktree remove "$dir" --force
          }

          publish_fix fix/deep-review-numeric-references-followup-20260917 cc72a11c157347d78388bf57a8168b09cf956dea 6e4fca09a3a741dc90e43d6200a9159e48b1ef60 'fix: normalize HTML numeric references without changing XML' .github/deep-review-followups/02-numeric-references.patch
          publish_fix fix/deep-review-form-clone-followup-20260917 312a06b17eeb410fa15837e23508f90c08ab7d8e c2fbf4a6d610098f3c57907973d01920ffc9f6a2 'fix: rebind copied form associations' .github/deep-review-followups/03-form-clone.patch
          publish_fix fix/deep-review-parse-errors-followup-20260917 f400782556c054147c82942c1947e3b3d61ddbb9 0e32595c5acdfd5970340e8531e891e7fbc46c87 'fix: reserve parser error storage without consuming budget' .github/deep-review-followups/04-parse-errors.patch
