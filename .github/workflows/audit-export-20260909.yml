name: Audit export and entity verification
on:
  push:
    branches: [audit/export-and-verify-20260909]
    paths: [.github/workflows/audit-export-20260909.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact Git objects without credentials
        run: |
          git bundle create "$RUNNER_TEMP/SwiftSoup.bundle" --all
          git show-ref > "$RUNNER_TEMP/refs.txt"
          sha256sum "$RUNNER_TEMP/SwiftSoup.bundle" > "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-swiftsoup-source
          path: |
            ${{ runner.temp }}/SwiftSoup.bundle
            ${{ runner.temp }}/refs.txt
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64eb1719bc30263c2c3fa9ccbfb75dc6c2a6b622
          persist-credentials: false
      - name: Verify merged entity production tree
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          swift --version
          swift test -c release 2>&1 | tee "$RUNNER_TEMP/entity-release.log"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-entity-${{ matrix.os }}
          path: ${{ runner.temp }}/entity-release.log
          retention-days: 30
