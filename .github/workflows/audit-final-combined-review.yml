name: Audit final combined PR review
on:
  push:
    branches: [audit/nth-selector-wrapup-20260909]
    paths: [.github/workflows/audit-final-combined-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      source: ${{ steps.combine.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: combine
        name: Combine exact published PRs in isolated source history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alex Ehlke'
          git config user.email 'alex.ehlke@gmail.com'
          git worktree add --detach "$RUNNER_TEMP/combined" f3c7052d8614e0d7a1d6ced70351a8eb68392499
          cd "$RUNNER_TEMP/combined"
          git merge --no-ff --no-commit da8b3f405be3efa25e6db907e7b7c877906f252e f6fb637a0cccaec1f5ab06de7a4507ac56ffdb34 46fcdb6cd89423e0374b0b4c676c7794b4caa168
          git diff --cached --check
          test "$(git write-tree)" = 984d978099ea528fe74facd4157a784088b262ec
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 12
          branch=audit/pr25-27-combined-source-20260909
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            source=$(git rev-parse "refs/remotes/origin/$branch")
            test "$(git rev-parse "$source^{tree}")" = 984d978099ea528fe74facd4157a784088b262ec
          else
            source=$(git commit-tree 984d978099ea528fe74facd4157a784088b262ec -p f3c7052d8614e0d7a1d6ced70351a8eb68392499 -p da8b3f405be3efa25e6db907e7b7c877906f252e -p f6fb637a0cccaec1f5ab06de7a4507ac56ffdb34 -p 46fcdb6cd89423e0374b0b4c676c7794b4caa168 -m 'Verification-only combination of canonical PRs 25, 26 and 27')
            git push origin "$source:refs/heads/$branch"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/export"
          git update-ref refs/heads/audit-combined-export "$source"
          git bundle create "$RUNNER_TEMP/export/SwiftSoup-combined.bundle" refs/heads/audit-combined-export
          git show -s --format='%H %T %P' "$source" > "$RUNNER_TEMP/export/source.txt"
          git diff f3c7052d8614e0d7a1d6ced70351a8eb68392499 "$source" > "$RUNNER_TEMP/export/combined.patch"
          cd "$RUNNER_TEMP/export"
          sha256sum SwiftSoup-combined.bundle combined.patch source.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-combined-source
          path: ${{ runner.temp }}/export
          retention-days: 30
          if-no-files-found: error
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Verify exact committed combination and all full suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = 984d978099ea528fe74facd4157a784088b262ec
          git show -s --format='%H %T %P' > "$RUNNER_TEMP/evidence/source.txt"
          swift --version > "$RUNNER_TEMP/evidence/compiler.txt"
          swift test -j 4 > "$RUNNER_TEMP/evidence/debug.log" 2>&1
          swift test -j 4 -c release > "$RUNNER_TEMP/evidence/release.log" 2>&1
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address > "$RUNNER_TEMP/evidence/asan.log" 2>&1
          for mode in debug release asan; do
            grep 'Executed 1190 tests, with 17 tests skipped and 0 failures' "$RUNNER_TEMP/evidence/$mode.log"
          done
          status=$(git status --porcelain)
          test -z "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-combined-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: warn
