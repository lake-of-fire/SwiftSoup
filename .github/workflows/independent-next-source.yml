name: Export immutable source for next hotspot study
on:
  push:
    branches: [review/independent-hotspots-20260909]
    paths: [.github/workflows/independent-next-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f3c7052d8614e0d7a1d6ced70351a8eb68392499
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact repository and branch inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/next-hotspot
          test "$(git rev-parse HEAD)" = f3c7052d8614e0d7a1d6ced70351a8eb68392499
          git bundle create /tmp/next-hotspot/source.bundle HEAD
          git ls-tree -r HEAD > /tmp/next-hotspot/source.tree
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/ > /tmp/next-hotspot/refs.txt
          sha256sum /tmp/next-hotspot/source.bundle > /tmp/next-hotspot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: next-hotspot-source
          path: /tmp/next-hotspot/
          retention-days: 14
