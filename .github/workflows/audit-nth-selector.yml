name: Nth selector reassessment
on:
  push:
    branches: [audit/nth-selector-reassessment-20260909]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    container: swift:6.1
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 272f204ac99a69a5180a703094040ac32cba1d68
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f3c7052d8614e0d7a1d6ced70351a8eb68392499
          path: source
      - name: Reconstruct exact source-only tree
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
          test "$(git rev-parse HEAD)" = f3c7052d8614e0d7a1d6ced70351a8eb68392499
          test "$(git rev-parse HEAD^{tree})" = 175028e6012e84a420c87b951fe9948e53d317db
          mkdir -p "$RUNNER_TEMP/nth-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, re
          old = pathlib.Path('../transport/.github/workflows/audit-nth-selector.yml').read_text()
          payload, = re.findall(r"payload = '([^']+)'", old)
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'nth-evidence')
          (out / 'original-transport.base64').write_text(payload)
          for before, after in [('WI+m0VxJfKa4', 'WI+m0VxklKa4'), ('SpAVbFCII+PH', 'SpAVbFCI+PH'), ('OUULSKSK85', 'OUULSKS85')]:
              assert payload.count(before) == 1, before
              payload = payload.replace(before, after)
          (out / 'corrected-transport.base64').write_text(payload)
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert len(patch) == 20610
          assert hashlib.sha256(patch).hexdigest() == '13a9d7222eecdef19a9f5dd8ea3ef8d97c6466c8ecb6c8f7036b3c7ae14c8ada'
          (out / 'nth-fix.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/nth-evidence/nth-fix.patch"
          git apply "$RUNNER_TEMP/nth-evidence/nth-fix.patch"
          git add Sources/QueryParser.swift Sources/Evaluator.swift Tests/SwiftSoupTests/NthSelectorBoundaryTest.swift CHANGELOG.md
          git diff --cached --check
          test "$(git write-tree)" = 2c727ad6ece730759ea2df1b3f63beb9102b94d6
          git diff --cached --stat > "$RUNNER_TEMP/nth-evidence/scope.txt"
      - name: Release qualification before publication
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          swift --version | tee "$RUNNER_TEMP/nth-evidence/toolchain.txt"
          swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/nth-evidence/release.log"
          test "$(git write-tree)" = 2c727ad6ece730759ea2df1b3f63beb9102b94d6
          git diff --exit-code
      - name: Publish source-only child without force
        id: publish
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'Fix numeric selector parsing and overflow-safe nth matching' | git commit-tree 2c727ad6ece730759ea2df1b3f63beb9102b94d6 -p f3c7052d8614e0d7a1d6ced70351a8eb68392499)
          git push origin "$commit:refs/heads/fix/nth-selector-boundaries-20260909"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$commit" 2c727ad6ece730759ea2df1b3f63beb9102b94d6 > "$RUNNER_TEMP/nth-evidence/published.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nth-selector-publication
          path: ${{ runner.temp }}/nth-evidence/
          if-no-files-found: error
          retention-days: 14
  linux:
    needs: publish
    runs-on: ubuntu-22.04
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Verify actual committed source and run all configurations
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = 2c727ad6ece730759ea2df1b3f63beb9102b94d6
          mkdir -p "$RUNNER_TEMP/nth-evidence"
          { git rev-parse HEAD HEAD^{tree}; swift --version; } | tee "$RUNNER_TEMP/nth-evidence/identity.txt"
          swift test -j 4 2>&1 | tee "$RUNNER_TEMP/nth-evidence/debug.log"
          swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/nth-evidence/release.log"
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address 2>&1 | tee "$RUNNER_TEMP/nth-evidence/asan.log"
          status=$(git status --porcelain)
          test -z "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nth-selector-linux
          path: ${{ runner.temp }}/nth-evidence/
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Verify actual committed source and run all configurations
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = 2c727ad6ece730759ea2df1b3f63beb9102b94d6
          mkdir -p "$RUNNER_TEMP/nth-evidence"
          { git rev-parse HEAD HEAD^{tree}; swift --version; } | tee "$RUNNER_TEMP/nth-evidence/identity.txt"
          swift test -j 4 2>&1 | tee "$RUNNER_TEMP/nth-evidence/debug.log"
          swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/nth-evidence/release.log"
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address 2>&1 | tee "$RUNNER_TEMP/nth-evidence/asan.log"
          status=$(git status --porcelain)
          test -z "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nth-selector-macos
          path: ${{ runner.temp }}/nth-evidence/
          if-no-files-found: error
          retention-days: 14
