name: PR45 stack-safety repair

on:
  push:
    branches:
      - fix/upstream-reader-output-policy-20260912

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upstream-reader-output-policy-20260912
          fetch-depth: 0
      - name: Apply iterative ancestor walks
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Sources/Node.swift')
          text = path.read_text()

          owner_pattern = r'''    @inline\(__always\)\n    open func ownerDocument\(\) -> Document\? \{.*?\n    \}\n\n    /// A token'''
          owner_replacement = '''    @inline(__always)
          open func ownerDocument() -> Document? {
              var node: Node? = self
              while let current = node {
                  if let document = current as? Document {
                      return document
                  }
                  node = current.parentNode
              }
              return nil
          }

          /// A token'''.replace('          ', '')

          dirty_pattern = r'''    @inline\(__always\)\n    @usableFromInline\n    internal func markSourceDirty\(force: Bool = false\) \{.*?\n    @inline\(__always\)\n    @usableFromInline\n    internal func setSourceRange'''
          dirty_replacement = '''    @inline(__always)
          @usableFromInline
          internal func markSourceDirty(force: Bool = false) {
              markSourceDirty(force: force, registerDirtyRoot: true)
          }

          @inline(__always)
          @usableFromInline
          internal func markSourceDirty(force: Bool = false, registerDirtyRoot: Bool) {
              var node: Node? = self
              var shouldRegisterDirtyRoot = registerDirtyRoot
              while let current = node {
                  if current.sourceRangeDirty {
                      if shouldRegisterDirtyRoot {
                          current.ownerDocument()?.registerDirtySourceRoot(current)
                      }
                      return
                  }
                  if !force, current.treeBuilder?.isBulkBuilding == true {
                      return
                  }
                  current.sourceRangeDirty = true
                  if shouldRegisterDirtyRoot {
                      current.ownerDocument()?.registerDirtySourceRoot(current)
                      shouldRegisterDirtyRoot = false
                  }
                  node = current.parentNode
              }
          }

          @inline(__always)
          @usableFromInline
          internal func setSourceRange'''.replace('          ', '')

          text, owner_count = re.subn(owner_pattern, owner_replacement, text, count=1, flags=re.S)
          text, dirty_count = re.subn(dirty_pattern, dirty_replacement, text, count=1, flags=re.S)
          if owner_count != 1 or dirty_count != 1:
              raise SystemExit(f'unexpected replacement counts owner={owner_count} dirty={dirty_count}')
          path.write_text(text)
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr45-stack-safety-repair.yml
          git add Sources/Node.swift
          git commit -m 'Make deep ancestor walks stack-safe'
          git push origin HEAD:fix/upstream-reader-output-policy-20260912
