name: CSS review four blob publication
on:
  push:
    branches: [fix/css-hex-identifier-escapes-20260908]
    paths: [.github/workflows/css-review4-publish.yml]
permissions:
  contents: write
jobs:
  publish-blobs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c0e5292b4060660ea097650ef41f6a093122faa
          persist-credentials: false
      - name: Verify candidate tree and publish immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'a3606eedeb4135bf528937d446615410f6eecab0295936231c428d4a0f3fd0bd'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '8c0e5292b4060660ea097650ef41f6a093122faa'
          pathlib.Path('/tmp/review4.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/review4.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/review4.patch'], check=True)
          paths = ['CHANGELOG.md', 'Sources/CssSelector.swift', 'Sources/Element.swift', 'Sources/Evaluator.swift', 'Tests/SwiftSoupTests/CssIndexConsistencyTest.swift']
          subprocess.run(['git', 'add', '--'] + paths, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'ad29b90f9d1db9f1cfa0106100cf4713a961f4f2', tree
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/SwiftSoup/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, (path, expected, actual)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': actual})
          manifest = {'tree': tree, 'entries': entries}
          print('VERIFIED_BLOBS=' + json.dumps(manifest))
          pathlib.Path('/tmp/review4-blobs.json').write_text(json.dumps(manifest, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: css-review4-verified-blobs
          path: /tmp/review4-blobs.json
