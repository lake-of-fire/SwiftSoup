name: CSS review verified blob preparation
on:
  push:
    branches: [fix/css-hex-identifier-escapes-20260908]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'lake-of-fire/SwiftSoup'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c2064ade4601e70b1d873a4c60862c494c821ff
          persist-credentials: false
      - name: Verify patch and prepare Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '6fa1eb8ac2b0b4e0b82336a3c430c3bef9cc2bbc129e073a6dcd412acb03f626', digest
          subprocess.run(['git','apply','--index','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert set(paths) == {'CHANGELOG.md','Sources/Collector.swift','Sources/CssSelector.swift','Sources/Element.swift','Sources/Node.swift','Tests/SwiftSoupTests/CssCollectorRefinementTest.swift'}
          subprocess.run(['git','rm','--cached','.github/workflows/css-review3-export.yml'], check=True)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == '4be91b2b23f228531514d8861727ca90a26cfe17', tree
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/SwiftSoup/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              assert sha == hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          output = pathlib.Path('/tmp/css-review3-blobs')
          output.mkdir()
          (output/'blobs.json').write_text(json.dumps({'tree':tree,'patch_sha256':digest,'tree_elements':entries},indent=2))
          print(json.dumps(entries))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: css-review3-blobs
          path: /tmp/css-review3-blobs
          retention-days: 7
