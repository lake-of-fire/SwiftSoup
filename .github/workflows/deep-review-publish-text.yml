name: Publish reviewed text selector fix
on:
  push:
    branches: [audit/deep-review-source-20260917]
    paths: [.github/workflows/deep-review-publish-text.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e32ac4abd8e37958cbd78f03348041917532bb8
      - name: Apply reviewed text selector changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap
          path = Path('Sources/Element.swift')
          source = path.read_text()
          start = source.index('    @inline(__always)\n    private static func lowerAscii(')
          end = source.index('    private static func appendWhitespaceIfBr(', start)
          replacement = '''@inline(__always)
          internal func containsNormalizedTextASCII(_ needleLower: [UInt8]) throws -> Bool {
              return Element.containsTextASCII(needleLower, in: try textUTF8())
          }

          @inline(__always)
          internal func containsOwnTextASCII(_ needleLower: [UInt8]) -> Bool {
              return Element.containsTextASCII(needleLower, in: ownTextUTF8())
          }

          private static func containsTextASCII(_ needleLower: [UInt8], in text: [UInt8]) -> Bool {
              guard !needleLower.isEmpty else { return false }
              // Reuse the public getters' normalization instead of maintaining a
              // second streaming normalizer (preserveWhitespace and final trim matter).
              // Byte matching is equivalent to String.contains only for ASCII text:
              // Unicode lowercasing and grapheme boundaries can change the answer.
              if StringUtil.isAscii(text) {
                  return StringUtil.containsLowercaseAscii(text, needleLower)
              }
              return String(decoding: text, as: UTF8.self).lowercased()
                  .contains(String(decoding: needleLower, as: UTF8.self))
          }

          '''
          path.write_text(source[:start] + textwrap.indent(replacement, '    ') + source[end:])
          path = Path('Sources/Evaluator.swift')
          source = path.read_text()
          old = '        public override func matches(_ root: Element, _ element: Element)throws->Bool {\n            if let needle = searchTextLowerUTF8 {\n                if let slice = element.textUTF8ByteSlice(trimAndNormaliseWhitespace: true) {'
          new = '        public override func matches(_ root: Element, _ element: Element)throws->Bool {\n            guard !searchText.isEmpty else { return false }\n            if let needle = searchTextLowerUTF8 {\n                if let slice = element.textUTF8ByteSlice(trimAndNormaliseWhitespace: true),\n                   StringUtil.isAscii(slice) {'
          assert source.count(old) == 2
          source = source.replace(old, new)
          old = 'return element.containsNormalizedTextASCII(needle)'
          assert source.count(old) == 1
          path.write_text(source.replace(old, 'return try element.containsNormalizedTextASCII(needle)'))
          subprocess.run(['git', 'add', 'Sources/Element.swift', 'Sources/Evaluator.swift'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '5a95fd786d70b114c7a6666a7be4e3fdfbd3277c', tree
      - name: Commit and publish only the verified feature branch
        run: |
          git diff --cached --check
          git config user.name 'SwiftSoup Review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve canonical text semantics in contains evaluators'
          git push origin HEAD:refs/heads/fix/review-text-selector-parity-20260917
          git rev-parse HEAD
