name: Publish QueryParser nesting repair
on:
  push:
    branches: [audit/deep-review-continuation-20260917]
    paths: [.github/workflows/publish-query-parser-nesting-20260917.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply qualified production patch
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/review-query-parser-nesting-20260917'
          expected_head='f514820ca09198c5d4ce402c6cb7df840f8595d2'
          expected_test_tree='79bf0c83c58763c61487d72f6a2af4c12f38094e'
          expected_fixed_tree='b4311c49629160aaa8f64b8873bb7c472eb5629f'
          git fetch origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected_head"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$expected_test_tree"
          dir="$(mktemp -d)"
          git worktree add --detach "$dir" FETCH_HEAD
          cd "$dir"
          git config user.name 'Alex Ehlke'
          git config user.email 'alex.ehlke@gmail.com'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/QueryParser.swift')
          s = p.read_text()
          s = s.replace('''    private var tq: TokenQueue
              private var query: String
              private var evals: Array<Evaluator>  = Array<Evaluator>()
          ''','''    private static let maxRecursiveSelectorDepth = 64
          
              private var tq: TokenQueue
              private var query: String
              private var evals: Array<Evaluator>  = Array<Evaluator>()
              private let recursiveDepth: Int
          ''')
          s = s.replace('''    private init(_ query: String) {
                  self.query = query
                  self.tq = TokenQueue(query)
              }
          ''','''    private init(_ query: String, recursiveDepth: Int) {
                  self.query = query
                  self.tq = TokenQueue(query)
                  self.recursiveDepth = recursiveDepth
              }
          ''')
          old = '''    public static func parse(_ query: String)throws->Evaluator {
                  let query = TokenQueue.trimCssQuery(query)
                  let cache = Self.cache
                  if let cached = cache?.get(query) {
                      return cached
                  }
                  
                  let p = QueryParser(query)
                  let eval = try p.parse()
                  cache?.set(query, eval)
                  return eval
              }
          '''
          new = '''    public static func parse(_ query: String)throws->Evaluator {
                  return try parse(query, recursiveDepth: 0)
              }
          
              private static func parse(_ query: String, recursiveDepth: Int) throws -> Evaluator {
                  guard recursiveDepth <= maxRecursiveSelectorDepth else {
                      throw Exception.Error(type: .SelectorParseException,
                                            Message: "Selector nesting exceeds the supported limit of \\(maxRecursiveSelectorDepth)")
                  }
          
                  let query = TokenQueue.trimCssQuery(query)
                  let cache = Self.cache
                  if let cached = cache?.get(query),
                     recursiveDepth + evaluatorGraphDepth(cached, stoppingAfter: maxRecursiveSelectorDepth) <= maxRecursiveSelectorDepth {
                      return cached
                  }
          
                  let p = QueryParser(query, recursiveDepth: recursiveDepth)
                  let eval = try p.parse()
                  guard recursiveDepth + evaluatorGraphDepth(eval, stoppingAfter: maxRecursiveSelectorDepth) <= maxRecursiveSelectorDepth else {
                      throw Exception.Error(type: .SelectorParseException,
                                            Message: "Selector nesting exceeds the supported limit of \\(maxRecursiveSelectorDepth)")
                  }
                  cache?.set(query, eval)
                  return eval
              }
          
              private static func evaluatorGraphDepth(_ evaluator: Evaluator, stoppingAfter limit: Int) -> Int {
                  var maximum = 0
                  var pending: [(Evaluator, Int)] = [(evaluator, 0)]
                  while let (current, depth) = pending.popLast() {
                      maximum = max(maximum, depth)
                      if maximum > limit { return maximum }
                      if let structural = current as? StructuralEvaluator {
                          pending.append((structural.evaluator, depth + 1))
                      } else if let combining = current as? CombiningEvaluator {
                          for child in combining.evaluators {
                              pending.append((child, depth + 1))
                          }
                      }
                  }
                  return maximum
              }
          
              private func parseSubquery(_ query: String) throws -> Evaluator {
                  return try QueryParser.parse(query, recursiveDepth: recursiveDepth + 1)
              }
          '''
          if old not in s: raise SystemExit('public parse block not found')
          s = s.replace(old, new)
          s = s.replace('let newEval: Evaluator = try QueryParser.parse(subQuery)', 'let newEval: Evaluator = try parseSubquery(subQuery)')
          s = s.replace('return StructuralEvaluator.Has(try QueryParser.parse(query), followingSiblings: followsSiblings)', 'return StructuralEvaluator.Has(try parseSubquery(query), followingSiblings: followsSiblings)')
          s = s.replace('evals.append(StructuralEvaluator.Not(try QueryParser.parse(subQuery)))', 'evals.append(StructuralEvaluator.Not(try parseSubquery(subQuery)))')
          p.write_text(s)
          PY
          git diff --check
          git add Sources/QueryParser.swift
          git commit -m 'fix: bound recursive selector parser and evaluator depth'
          test "$(git rev-parse HEAD^{tree})" = "$expected_fixed_tree"
          git push origin "HEAD:refs/heads/$branch"
