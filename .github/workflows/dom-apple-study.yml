name: Isolated Apple DOM confirmation

on:
  push:
    branches: [perf/apple-dom-confirm-20260908]

permissions:
  contents: read

concurrency:
  group: apple-dom-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record machine and toolchain
        run: |
          uname -a
          sw_vers
          swiftc --version
          sysctl -n machdep.cpu.brand_string
      - name: Build pinned release variants and run balanced comparisons
        env:
          STUDY_OUTPUT: ${{ runner.temp }}/dom-study
        run: python3 Tools/DOMStudy/confirm.py
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-dom-confirm-${{ github.sha }}
          path: ${{ runner.temp }}/dom-study
          retention-days: 14
