name: PR45 compatibility repair

on:
  push:
    branches:
      - fix/upstream-reader-output-policy-20260912

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python3 .github/pr45_repair.py
      - name: Commit repair
        shell: bash
        run: |
          rm .github/pr45_repair.py .github/workflows/pr45-compatibility-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/Node.swift Tests/SwiftSoupTests/ReaderDocumentOutputTests.swift .github/pr45_repair.py .github/workflows/pr45-compatibility-repair.yml
          git commit -m "Preserve subclass semantics in stack-safe output paths"
          git push origin HEAD:fix/upstream-reader-output-policy-20260912
