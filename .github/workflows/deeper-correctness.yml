name: Deeper correctness qualification
on:
  push:
    branches: [audit/deeper-correctness-20260909]
    paths: [.github/workflows/deeper-correctness.yml]
permissions:
  contents: read
jobs:
  ordered-set-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d7caaf72938f434f5cb3956de63a56bcefe5703
          fetch-depth: 0
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4d7caaf72938f434f5cb3956de63a56bcefe5703
          test "$(git rev-parse HEAD^{tree})" = c175bef3bd8b5420aaa7827794e819e1287fa5cd
          test "$(git ls-remote origin refs/heads/fix/ordered-set-sequence-identity-20260909 | cut -f1)" = 4d7caaf72938f434f5cb3956de63a56bcefe5703
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/OrderedSet.swift')
          text = p.read_text()
          old = '''public func +<T, S: Sequence> (lhs: OrderedSet<T>, rhs: S) -> OrderedSet<T> where S.Iterator.Element == T {
          \tlet joinedSet = lhs
          \tjoinedSet.append(contentsOf: rhs)

          \treturn joinedSet
          }'''.replace('          ', '')
          new = '''public func +<T, S: Sequence> (lhs: OrderedSet<T>, rhs: S) -> OrderedSet<T> where S.Iterator.Element == T {
          \tlet joinedSet = OrderedSet(sequence: lhs)
          \tjoinedSet.append(contentsOf: rhs)

          \treturn joinedSet
          }'''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''public func -<T, S: Sequence> (lhs: OrderedSet<T>, rhs: S) -> OrderedSet<T> where S.Iterator.Element == T {
          \tlet purgedSet = lhs
          \tpurgedSet.remove(rhs)

          \treturn purgedSet
          }'''.replace('          ', '')
          new = '''public func -<T, S: Sequence> (lhs: OrderedSet<T>, rhs: S) -> OrderedSet<T> where S.Iterator.Element == T {
          \tlet purgedSet = OrderedSet(sequence: lhs)
          \tpurgedSet.remove(rhs)

          \treturn purgedSet
          }'''.replace('          ', '')
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          Path('Tests/SwiftSoupTests/OrderedSetOperatorIsolationTest.swift').write_text(r'''import XCTest
          import SwiftSoup

          final class OrderedSetOperatorIsolationTest: XCTestCase {
              private final class Item: Hashable {
                  let key: Int
                  let payload: String
                  init(_ key: Int, _ payload: String) { self.key = key; self.payload = payload }
                  static func == (lhs: Item, rhs: Item) -> Bool { lhs.key == rhs.key }
                  func hash(into hasher: inout Hasher) { hasher.combine(key) }
              }

              func testPlusReturnsIndependentSetWithoutMutatingLeftOperand() {
                  let lhs = OrderedSet(sequence: [1, 2, 3])
                  let result = lhs + [3, 4]
                  XCTAssertEqual(Array(lhs), [1, 2, 3])
                  XCTAssertEqual(Array(result), [1, 2, 3, 4])
                  XCTAssertFalse(lhs === result)
              }

              func testMinusReturnsIndependentSetWithoutMutatingLeftOperand() {
                  let lhs = OrderedSet(sequence: [1, 2, 3])
                  let result = lhs - [2, 9]
                  XCTAssertEqual(Array(lhs), [1, 2, 3])
                  XCTAssertEqual(Array(result), [1, 3])
                  XCTAssertFalse(lhs === result)
              }

              func testResultsDoNotShareSubsequentMutation() {
                  let lhs = OrderedSet(sequence: [1, 2, 3])
                  let plus = lhs + [4]
                  let minus = lhs - [2]
                  plus.append(5)
                  minus.remove(1)
                  XCTAssertEqual(Array(lhs), [1, 2, 3])
                  XCTAssertEqual(Array(plus), [1, 2, 3, 4, 5])
                  XCTAssertEqual(Array(minus), [3])
              }

              func testPlusRetainsAppendReplacementSemanticsOnlyInResult() {
                  let original = Item(1, "original")
                  let other = Item(2, "other")
                  let replacement = Item(1, "replacement")
                  let lhs = OrderedSet(sequence: [original, other])
                  let result = lhs + [replacement]
                  XCTAssertTrue(lhs[0] === original)
                  XCTAssertTrue(lhs[1] === other)
                  XCTAssertTrue(result[0] === replacement)
                  XCTAssertTrue(result[1] === other)
              }

              func testMutatingOperatorsStillMutateInPlace() {
                  var value = OrderedSet(sequence: [1, 2, 3])
                  let identity = value
                  value += [4]
                  XCTAssertTrue(value === identity)
                  XCTAssertEqual(Array(value), [1, 2, 3, 4])
                  value -= [2]
                  XCTAssertTrue(value === identity)
                  XCTAssertEqual(Array(value), [1, 3, 4])
              }
          }
          '''.replace('          ', ''))
          PY
          git add Sources/OrderedSet.swift Tests/SwiftSoupTests/OrderedSetOperatorIsolationTest.swift
          git diff --cached --check
          swift test -j 4 --filter OrderedSetOperatorIsolationTest
          git config user.name 'OpenAI assistant'
          git config user.email noreply@openai.com
          git commit -m 'Keep nonmutating OrderedSet operators independent'
          git push origin HEAD:refs/heads/fix/ordered-set-sequence-identity-20260909
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  token-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97e071d6d42794ebbca7716a22605176325c6445
          fetch-depth: 0
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 97e071d6d42794ebbca7716a22605176325c6445
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = 97e071d6d42794ebbca7716a22605176325c6445
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/TokenQueue.swift')
          text = p.read_text()
          old = '''    open func consumeToIgnoreCase(_ seq: String) -> String {
              let start = pos
          '''.replace('          ', '')
          new = '''    open func consumeToIgnoreCase(_ seq: String) -> String {
              guard !seq.isEmpty else { return "" }
              let start = pos
          '''.replace('          ', '')
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          Path('Tests/SwiftSoupTests/TokenQueueEmptyIgnoreCaseDelimiterTest.swift').write_text(r'''import XCTest
          import SwiftSoup

          final class TokenQueueEmptyIgnoreCaseDelimiterTest: XCTestCase {
              func testConsumeToIgnoreCaseEmptyDelimiterIsNoOp() {
                  let queue = TokenQueue("AbC")
                  XCTAssertEqual(queue.consumeToIgnoreCase(""), "")
                  XCTAssertEqual(queue.remainder(), "AbC")
              }

              func testChompToIgnoreCaseEmptyDelimiterIsNoOp() {
                  let queue = TokenQueue("AbC")
                  XCTAssertEqual(queue.chompToIgnoreCase(""), "")
                  XCTAssertEqual(queue.remainder(), "AbC")
              }

              func testEmptyDelimiterAfterPriorConsumptionPreservesPosition() {
                  let queue = TokenQueue("AbC")
                  XCTAssertTrue(queue.matchChomp("A"))
                  XCTAssertEqual(queue.consumeToIgnoreCase(""), "")
                  XCTAssertEqual(queue.remainder(), "bC")
              }

              func testEmptyDelimiterMatchesCaseSensitiveContract() {
                  let sensitive = TokenQueue("AbC")
                  let insensitive = TokenQueue("AbC")
                  XCTAssertEqual(sensitive.consumeTo(""), insensitive.consumeToIgnoreCase(""))
                  XCTAssertEqual(sensitive.remainder(), insensitive.remainder())
              }

              func testEmptyQueueAlsoAcceptsEmptyDelimiter() {
                  let queue = TokenQueue("")
                  XCTAssertEqual(queue.consumeToIgnoreCase(""), "")
                  XCTAssertEqual(queue.chompToIgnoreCase(""), "")
                  XCTAssertTrue(queue.isEmpty())
              }
          }
          '''.replace('          ', ''))
          PY
          git add Sources/TokenQueue.swift Tests/SwiftSoupTests/TokenQueueEmptyIgnoreCaseDelimiterTest.swift
          git diff --cached --check
          swift test -j 4 --filter TokenQueueEmptyIgnoreCaseDelimiterTest
          git config user.name 'OpenAI assistant'
          git config user.email noreply@openai.com
          git commit -m 'Handle empty case-insensitive TokenQueue delimiters'
          git push origin HEAD:refs/heads/fix/tokenqueue-empty-ignorecase-20260909
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  ordered-set-native:
    needs: ordered-set-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ordered-set-publish.outputs.commit }}
          persist-credentials: false
      - name: Full exact-source suites
        shell: bash
        run: |
          set -euo pipefail
          swift test -j 4
          swift test -j 4 -c release
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address
          test -z "$(git status --porcelain --untracked-files=all)"
  token-native:
    needs: token-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.token-publish.outputs.commit }}
          persist-credentials: false
      - name: Full exact-source suites
        shell: bash
        run: |
          set -euo pipefail
          swift test -j 4
          swift test -j 4 -c release
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address
          test -z "$(git status --porcelain --untracked-files=all)"
