name: CSS review refinement evidence
on:
  push:
    branches: [fix/css-hex-identifier-escapes-20260908]
permissions:
  contents: write
jobs:
  evidence:
    if: github.repository == 'lake-of-fire/SwiftSoup'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare verified blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == '8fc81d5b08426f4bb75b010fa54389f9be5a995c'
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '690266ef607126737e261e92aca9007355c5f36572c81e9d67183cd8bb3c3dfe', digest
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '--cached', '.github/workflows/css-escape-review.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '4e72a83497a33b8c9382d20bcd2e2d8a8c504203', tree
          paths = ['CHANGELOG.md', 'Sources/CssSelector.swift', 'Sources/Element.swift', 'Sources/QueryParser.swift', 'Sources/TokenQueue.swift', 'Tests/SwiftSoupTests/CssEscapeReviewTest.swift']
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/SwiftSoup/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              assert sha == hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          destination = pathlib.Path('/tmp/css-review-final')
          destination.mkdir()
          manifest = {'tree':tree,'patch_sha256':digest,'tree_elements':entries}
          (destination/'blobs.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: css-second-review-blobs
          path: /tmp/css-review-final
          retention-days: 7
