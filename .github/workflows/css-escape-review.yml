name: CSS fork integration evidence
on:
  push:
    branches: [fix/css-hex-identifier-escapes-20260908]
permissions:
  contents: write
jobs:
  evidence:
    if: github.repository == 'lake-of-fire/SwiftSoup'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare verified integration blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''''''
          encoded = encoded.replace('2WRJJuei', '2WRJuei')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '4ccb875b7ecdeb842d9b846243839614b0dc12e35dfc02de17cb5390358ccf2e', digest
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          paths = ['Sources/Element.swift', 'Tests/SwiftSoupTests/CssSelectorUnicodeRegressionTest.swift']
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/SwiftSoup/git/blobs', data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              local_sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert sha == local_sha
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          destination = pathlib.Path('/tmp/css-integration')
          destination.mkdir()
          (destination / 'blobs.json').write_text(json.dumps({'patch_sha256': digest, 'tree_elements': entries}, indent=2))
          print(json.dumps(entries, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: css-integration-blobs
          path: /tmp/css-integration
          retention-days: 7
