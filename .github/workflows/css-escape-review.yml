name: CSS class regression evidence
on:
  push:
    branches: [fix/css-hex-identifier-escapes-20260908]
permissions:
  contents: write
jobs:
  evidence:
    if: github.repository == 'lake-of-fire/SwiftSoup'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare verified blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '80dad9493078950da54bffcc649cf1cc1c1aa687ae1b712c9fb1571eb26be869', digest
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          entries = []
          for path in ['Sources/QueryParser.swift', 'Tests/SwiftSoupTests/CssSelectorUnicodeRegressionTest.swift']:
              data = pathlib.Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/SwiftSoup/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              assert sha == hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          destination = pathlib.Path('/tmp/css-final')
          destination.mkdir()
          (destination/'blobs.json').write_text(json.dumps({'patch_sha256':digest,'tree_elements':entries},indent=2))
          print(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: css-class-blobs
          path: /tmp/css-final
          retention-days: 7
