name: CSS escape review evidence
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  evidence:
    if: github.head_ref == 'fix/css-hex-identifier-escapes-20260908' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare verified source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'dc1d3f77558287a43b0b976f4866c8fa93602a34f89e155d0403449060a81210', digest
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          paths = ['CHANGELOG.md', 'Sources/Collector.swift', 'Sources/CssSelector.swift', 'Sources/Element.swift', 'Sources/QueryParser.swift', 'Sources/QueryParserCache.swift', 'Sources/SelectorQueryKey.swift', 'Sources/StructuralEvaluator.swift', 'Sources/TokenQueue.swift', 'Tests/SwiftSoupTests/CssSelectorUnicodeRegressionTest.swift']
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/SwiftSoup/git/blobs', data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              local_sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert sha == local_sha
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          destination = pathlib.Path('/tmp/css-review')
          destination.mkdir()
          (destination / 'blobs.json').write_text(json.dumps({'source_commit': source, 'patch_sha256': digest, 'tree_elements': entries}, indent=2))
          (destination / 'refinement.patch').write_bytes(patch)
          print(json.dumps(entries, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: css-review-refinement
          path: /tmp/css-review
          retention-days: 7
