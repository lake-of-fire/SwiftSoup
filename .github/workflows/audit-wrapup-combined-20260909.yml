name: Audit wrapup combined source
on:
  push:
    branches: [audit/export-and-verify-20260909]
    paths: [.github/workflows/audit-wrapup-combined-20260909.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f3c7052d8614e0d7a1d6ced70351a8eb68392499
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct immutable combined source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrapup-evidence"
          git config user.name 'PR Audit Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ref in da8b3f405be3efa25e6db907e7b7c877906f252e f6fb637a0cccaec1f5ab06de7a4507ac56ffdb34 46fcdb6cd89423e0374b0b4c676c7794b4caa168; do
            git merge --no-edit --no-ff "$ref"
          done
          test "$(git rev-parse 'HEAD^{tree}')" = 984d978099ea528fe74facd4157a784088b262ec
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T' > "$RUNNER_TEMP/wrapup-evidence/source.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/wrapup-evidence/tree.txt"
          git diff --stat f3c7052d8614e0d7a1d6ced70351a8eb68392499 > "$RUNNER_TEMP/wrapup-evidence/diff-stat.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/wrapup-evidence/source.tar.gz"
          swift --version > "$RUNNER_TEMP/wrapup-evidence/compiler.txt"
      - name: Full debug release and AddressSanitizer suites
        shell: bash
        run: |
          set -euo pipefail
          swift test -j 4 > "$RUNNER_TEMP/wrapup-evidence/debug.log" 2>&1
          swift test -j 4 -c release > "$RUNNER_TEMP/wrapup-evidence/release.log" 2>&1
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address > "$RUNNER_TEMP/wrapup-evidence/asan.log" 2>&1
          test "$(git rev-parse 'HEAD^{tree}')" = 984d978099ea528fe74facd4157a784088b262ec
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapup-combined-${{ matrix.os }}
          path: ${{ runner.temp }}/wrapup-evidence
          retention-days: 30
          if-no-files-found: error
