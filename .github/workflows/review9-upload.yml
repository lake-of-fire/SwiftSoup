name: Review 9 verified source upload
on:
  push:
    branches: [fix/review9-upload-20260909]
    paths: [.github/workflows/review9-upload.yml]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 933051055c529d3d2460556a77209c64e2785f97
          persist-credentials: false
      - name: Verify both reviewed trees before publishing their blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'lake-of-fire/SwiftSoup'
          def api(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          parts = ['984a021fc5ecfd5ca3469636e2412431d0e80f78', 'b3b29a6550dc4eeaaf90f59b0e19ed8fc65d32ee', 'ea83073569adddfdffa994e19806771ca5a9f3c3', 'e15241024e31d181ce2aba2535cf7f4110c10826']
          chunks = []
          for sha in parts:
              blob = api('/git/blobs/' + sha)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == '8c65318e7813acdd9f13c81ffba46e177c5764a1627e0723a37e03d2d2e42cbd'
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == 'e39d2828ad9a7adbd3de483d86b6999e2f321e185b2ffb6c48466d6b0d6f788d'
          payload = json.loads(raw)
          assert git('rev-parse', 'HEAD') == payload['base_commit']
          assert git('rev-parse', 'HEAD^{tree}') == payload['base_tree']
          manifest = []
          for stage in payload['stages']:
              patch = pathlib.Path('/tmp/' + stage['name'] + '.patch')
              patch.write_text(stage['patch'])
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
              subprocess.run(['git', 'add', '--'] + stage['paths'], check=True)
              tree = git('write-tree')
              assert tree == stage['tree'], (tree, stage['tree'])
              entries = []
              for path in stage['paths']:
                  content = pathlib.Path(path).read_bytes()
                  expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  actual = api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})['sha']
                  assert actual == expected, (path, actual, expected)
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': actual})
              record = {'stage': stage['name'], 'tree': tree, 'entries': entries}
              manifest.append(record)
              print('VERIFIED_STAGE=' + json.dumps(record), flush=True)
          pathlib.Path('/tmp/review9-manifest.json').write_text(json.dumps(manifest, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: review9-verified-manifest
          path: /tmp/review9-manifest.json
