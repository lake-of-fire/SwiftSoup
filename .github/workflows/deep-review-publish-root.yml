name: Publish reviewed root selector fix
on:
  push:
    branches: [audit/deep-review-source-20260917]
    paths: [.github/workflows/deep-review-publish-root.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56529ed66ee4aecab2b7a1fd9454a6704e3a55f2
      - name: Apply reviewed root-element lookup
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('Sources/Evaluator.swift')
          source = path.read_text()
          old = '            let r: Element = ((root as? Document) != nil) ? root.child(0) : root\n            return element === r\n'
          new = '            if root is Document {\n                // Empty and comment-only documents have no document element.\n                // Do not turn a valid selector miss into an out-of-bounds trap.\n                return element === root.children().first()\n            }\n            return element === root\n'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          subprocess.run(['git', 'add', 'Sources/Evaluator.swift'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '668793e51f00e3c5c735913f86e3888db3bf01f4', tree
      - name: Commit and publish only the verified feature branch
        run: |
          git diff --cached --check
          git config user.name 'SwiftSoup Review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: let root selectors miss documents without an element'
          git push origin HEAD:refs/heads/fix/review-empty-document-root-20260917
          git rev-parse HEAD
