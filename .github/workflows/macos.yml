name: macOS Swift



on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "fix/**" ]

jobs:
  build:
    name: Swift on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15]
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Print Swift version
      run: swift --version
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      shell: bash
      run: |
        set +e
        swift test -v > /tmp/swift-test.log 2>&1
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "=== concise failing-test diagnostics ==="
          grep -E "Test Case .* failed|XCTAssert|error:|failed \(|failure:" /tmp/swift-test.log | tail -n 120 || true
        fi
        exit "$status"
