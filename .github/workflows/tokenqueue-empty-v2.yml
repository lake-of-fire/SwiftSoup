name: TokenQueue empty delimiter qualification
on:
  push:
    branches: [audit/deeper-correctness-20260909]
    paths: [.github/workflows/tokenqueue-empty-v2.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97e071d6d42794ebbca7716a22605176325c6445
          fetch-depth: 0
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 97e071d6d42794ebbca7716a22605176325c6445
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = 97e071d6d42794ebbca7716a22605176325c6445
          test -z "$(git ls-remote origin refs/heads/fix/tokenqueue-empty-ignorecase-20260909)"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('Sources/TokenQueue.swift')
          text = p.read_text()
          old = '    open func consumeToIgnoreCase(_ seq: String) -> String {\n        let start = pos\n'
          new = '    open func consumeToIgnoreCase(_ seq: String) -> String {\n        guard !seq.isEmpty else { return "" }\n        let start = pos\n'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          test_b64 = ''
          Path('Tests/SwiftSoupTests/TokenQueueEmptyIgnoreCaseDelimiterTest.swift').write_bytes(base64.b64decode(test_b64))
          PY
          git add Sources/TokenQueue.swift Tests/SwiftSoupTests/TokenQueueEmptyIgnoreCaseDelimiterTest.swift
          git diff --cached --check
          test "$(git hash-object Sources/TokenQueue.swift)" = 9165308a41a7b9d1f5f458b696c0d3c63e8a1557
          test "$(git hash-object Tests/SwiftSoupTests/TokenQueueEmptyIgnoreCaseDelimiterTest.swift)" = 0087fdd80a8d7cab06b29008c5cea81513f74ab1
          swift test -j 4 --filter TokenQueueEmptyIgnoreCaseDelimiterTest
          git config user.name 'OpenAI assistant'
          git config user.email noreply@openai.com
          git commit -m 'Handle empty case-insensitive TokenQueue delimiters'
          git push origin HEAD:refs/heads/fix/tokenqueue-empty-ignorecase-20260909
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Full exact-source suites
        shell: bash
        run: |
          set -euo pipefail
          swift test -j 4
          swift test -j 4 -c release
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address
          test -z "$(git status --porcelain --untracked-files=all)"
