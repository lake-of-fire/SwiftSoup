name: Review continuation source
on:
  push:
    branches: [audit/deep-review-continuation-20260917]
    paths: [.github/workflows/deep-review-continuation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 579430cf6909c4f3b3cb0da2150c01a4b32114aa
          persist-credentials: false
      - name: Export pinned source
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/manifest.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: swiftsoup-continuation-579430cf
          path: ${{ runner.temp }}/source/
          retention-days: 7
