name: Validate entity buffer-bound repair
on:
  push:
    branches: [audit/deep-review-continuation-20260917]
    paths: [.github/workflows/validate-entity-buffer-bounds-20260917.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify red green and full suite
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 3ddc37abc29ab929acb2209f2980e47d7a2ecba1
          set +e
          swift test -j 4 --filter EntityEscapeBufferBoundaryTest > /tmp/red.log 2>&1
          red=$?
          set -e
          cat /tmp/red.log
          test "$red" -ne 0
          grep -Eq 'failed|XCTAssert|error:' /tmp/red.log
          git checkout --detach 981b71d9f520fa91cbda1785e24e2f06f4ec7928
          swift test -j 4 --filter EntityEscapeBufferBoundaryTest
          swift test -j 4
