name: Temporary verified attribute follow-up blob publication
on:
  push:
    branches: [review/attribute-followup-publisher-20260909]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 933051055c529d3d2460556a77209c64e2785f97
      - name: Verify both complete trees and publish immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          REPO = "lake-of-fire/SwiftSoup"
          BASE = "99cdd32945282b78d3c6d60726247d227433e3bb"
          STAGES = [
              {"name": "deferred", "tree": "6a5c25ef4d713f9e257201fa8bff7677f04cbb76", "patch_sha256": "bb00cf9b9f03fc9ba872818280c4a76e9a4aef99048ea6e0bdf6dcf2ba85f7b3", "chunks": ["1f2d6c41d52b673731eb6cde97492fdd311d3499", "1946c538603a2e1c9605bb682cebe542b914c08e", "2854f3b6005cb41bf4761b860d7aad1f61761701", "dbc2db69a8709dbf92b7eba2e5e6ce217bd37b8e", "a9d7fc1ccd39e7a0918b233226385c69277d48cd", "daf1c7fadbf8ba50fe590436ef5d155061bbd037"]},
              {"name": "hash-observers", "tree": "dcf64b56e81235d1d0339fb5a64bc48e70fcfe82", "patch_sha256": "9bc25b221f413ed99f2219863d0f0e5699c4d94933614acea7004277e5c0c5bf", "chunks": ["73995447b18c31d60752e844248832063e1fd2e9", "c38ccbb3c7bb58c28d1506ff2366130e9bb9b102", "3afcda22ecfd47b47014c704f7bf56bc6f88d9ce"]}
          ]
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request("https://api.github.com/repos/" + REPO + path, data=data, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert git("rev-parse", "HEAD") == "933051055c529d3d2460556a77209c64e2785f97"
          assert git("rev-parse", "HEAD^{tree}") == BASE
          previous = BASE
          uploaded = set()
          manifest = {"repository": REPO, "base_tree": BASE, "stages": []}
          for stage in STAGES:
              chunks = []
              for sha in stage["chunks"]:
                  result = api("/git/blobs/" + sha)
                  assert result["encoding"] == "base64"
                  chunk = base64.b64decode(result["content"])
                  assert blob_sha(chunk) == sha
                  chunks.append(chunk)
              patch = zlib.decompress(b"".join(chunks))
              assert hashlib.sha256(patch).hexdigest() == stage["patch_sha256"]
              subprocess.run(["git", "apply", "--check", "--index", "-"], input=patch, check=True)
              subprocess.run(["git", "apply", "--index", "-"], input=patch, check=True)
              tree = git("write-tree")
              assert tree == stage["tree"], (stage["name"], tree)
              entries = []
              for path in git("diff", "--name-only", previous, tree).splitlines():
                  data = pathlib.Path(path).read_bytes()
                  expected = blob_sha(data)
                  if expected not in uploaded:
                      result = api("/git/blobs", {"content": base64.b64encode(data).decode(), "encoding": "base64"})
                      assert result["sha"] == expected
                      uploaded.add(expected)
                  mode = git("ls-files", "-s", "--", path).split()[0]
                  entries.append({"path": path, "mode": mode, "type": "blob", "sha": expected})
              manifest["stages"].append({"name": stage["name"], "tree": tree, "base_tree": previous, "entries": entries})
              previous = tree
          print("PUBLICATION_MANIFEST=" + json.dumps(manifest, sort_keys=True))
          pathlib.Path("/tmp/publication-manifest.json").write_text(json.dumps(manifest, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("```json\n" + json.dumps(manifest, indent=2) + "\n```\n")
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: verified-attribute-publication-manifest
          path: /tmp/publication-manifest.json
