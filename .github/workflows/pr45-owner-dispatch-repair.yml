name: PR45 terminal owner dispatch repair

on:
  push:
    branches:
      - fix/upstream-reader-output-policy-20260912

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve terminal Document dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/Node.swift')
          s = p.read_text()
          old = '''            if let document = current as? Document {
                return document
            }
'''
          new = '''            if let document = current as? Document {
                // Preserve the historical virtual dispatch at the owning
                // Document while keeping the ancestor walk itself iterative.
                return document.ownerDocument()
            }
'''
          if s.count(old) != 1:
              raise SystemExit(f'owner terminal count={s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/pr45-owner-dispatch-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/Node.swift .github/workflows/pr45-owner-dispatch-repair.yml
          git commit -m "Preserve owner Document dispatch in stack-safe lookup"
          git push origin HEAD:fix/upstream-reader-output-policy-20260912
